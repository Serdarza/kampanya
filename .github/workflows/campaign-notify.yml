name: Kampanya bildirimi

on:
  schedule:
    # 09:40 (TR) = 06:40 UTC. İş, 10:00 (TR)'a kadar bekler ve gönderir.
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: campaign-collector
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Istanbul
      PYTHONUNBUFFERED: "1"
      FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bağımlılıklar
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Yeni kampanya bildirimi (10:00 TR)
        run: python -m collector.notify --wait-until-send-time

      - name: Bildirim kaydını commit ve push
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- .collector/notifications.json)" ]; then
            echo "Bildirim defterinde değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .collector/notifications.json
          git commit -m "chore: campaign notification record"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
