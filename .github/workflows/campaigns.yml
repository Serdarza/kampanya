name: Kamu personeli kampanya taraması

on:
  schedule:
    # Her gün 07:00 (Türkiye, UTC+3) = 04:00 UTC
    - cron: "0 4 * * *"
    # Yeni kampanya bildirimi: 09:40 (TR) = 06:40 UTC. İş, 10:00 (TR)'a kadar bekler ve gönderir.
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (dosya yazma, commit atma)"
        type: boolean
        default: false
      send_notification:
        description: "Bekleyen kampanya bildirimini şimdi gönder"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: campaign-collector
  cancel-in-progress: false

jobs:
  collect:
    # 09:40 tetikleyicisi yalnızca bildirim işi içindir; tarama davranışı değişmez.
    if: github.event.schedule != '40 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Istanbul
      PYTHONUNBUFFERED: "1"
      # Girdi, kabuğa doğrudan gömülmez; yalnızca ortam değişkeni olarak okunur.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Bağımlılıklar
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint ve testler
        run: |
          python -m ruff check collector tests
          python -m pytest -q

      - name: Kampanyaları tara
        run: python -m collector

      - name: Rapor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-report
          path: reports/last-run.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Değişiklik varsa commit ve push
        if: env.DRY_RUN != 'true'
        run: |
          if [ -z "$(git status --porcelain -- kampanya.json .collector/state.json .collector/notifications.json)" ]; then
            echo "Değişiklik yok, commit oluşturulmadı."
            exit 0
          fi
          python -c "import json; json.load(open('kampanya.json', encoding='utf-8'))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- kampanya.json .collector/state.json .collector/notifications.json
          git commit -m "chore: automatic campaign update"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # GitHub cron gecikse bile: tarama 10:00'dan sonra bittiyse bildirim hemen gider.
      # 10:00'dan önceyse bekleyen kayıt 09:40 işine bırakılır.
      - name: Yeni kampanya bildirimi
        if: env.DRY_RUN != 'true'
        run: python -m collector.notify --wait-until-send-time --max-wait-minutes 0

      - name: Bildirim kaydını commit ve push
        if: env.DRY_RUN != 'true' && always()
        run: |
          if [ -z "$(git status --porcelain -- .collector/notifications.json)" ]; then
            echo "Bildirim defterinde değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .collector/notifications.json
          git commit -m "chore: campaign notification record"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

  notify:
    # 09:40 (TR) zamanlayıcısı veya elle "bildirim gönder". Tarama işinden sonra
    # çalışır ki defter güncel olsun; aynı bekleyen kayıt iki kez gönderilmez.
    needs: collect
    if: >
      always() && !cancelled() && (
        (github.event_name == 'schedule' && github.event.schedule == '40 6 * * *')
        || (github.event_name == 'workflow_dispatch' && inputs.send_notification)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Istanbul
      PYTHONUNBUFFERED: "1"
      FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bağımlılıklar
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Yeni kampanya bildirimi (10:00 TR)
        run: python -m collector.notify --wait-until-send-time

      - name: Bildirim kaydını commit ve push
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- .collector/notifications.json)" ]; then
            echo "Bildirim defterinde değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .collector/notifications.json
          git commit -m "chore: campaign notification record"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
